# Typeface for the mockup. fetch-assets.sh reads this file; environment
# variables of the same name override it for a one-off run.
# Keep FONT in sync with --font-plain in styles.css.
# FONT_WEIGHTS must exist in the family on Google Fonts
# (e.g. "BIZ UDPGothic" has only 400;700).
FONT="IBM Plex Sans JP"
FONT_WEIGHTS="400;500;700"
